name: 🚀 Deploy Wedding Website

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: "20"
  BUN_VERSION: "latest"

jobs:
  # Job 1: Pre-deployment Checks
  pre-deploy:
    name: 🔍 Pre-deployment Checks
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.determine-env.outputs.environment }}
      should-deploy: ${{ steps.determine-env.outputs.should-deploy }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🎯 Determine deployment environment
        id: determine-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          else
            echo "environment=none" >> $GITHUB_OUTPUT
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: 💒 Wedding information check
        run: |
          echo "## Pre-deployment Wedding Check 💒" >> $GITHUB_STEP_SUMMARY
          echo "### Wedding Details:" >> $GITHUB_STEP_SUMMARY
          echo "- Couple: Alfina & Mugni" >> $GITHUB_STEP_SUMMARY
          echo "- Date: December 15, 2024" >> $GITHUB_STEP_SUMMARY
          echo "- Location: Jakarta, Indonesia" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ steps.determine-env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY

          # Calculate days until wedding
          WEDDING_DATE="2024-12-15"
          CURRENT_DATE=$(date +%Y-%m-%d)
          DAYS_UNTIL=$(( ($(date -d "$WEDDING_DATE" +%s) - $(date -d "$CURRENT_DATE" +%s)) / 86400 ))

          if [ $DAYS_UNTIL -gt 0 ]; then
            echo "- Days until wedding: $DAYS_UNTIL 🗓️" >> $GITHUB_STEP_SUMMARY
          elif [ $DAYS_UNTIL -eq 0 ]; then
            echo "- 🎉 IT'S THE WEDDING DAY! 🎉" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Wedding celebration completed! 💕" >> $GITHUB_STEP_SUMMARY
          fi

  # Job 2: Build for Deployment
  build:
    name: 🏗️ Build for ${{ needs.pre-deploy.outputs.environment }}
    runs-on: ubuntu-latest
    needs: pre-deploy
    if: needs.pre-deploy.outputs.should-deploy == 'true'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏗️ Build website
        env:
          NODE_ENV: production
          VITE_WEDDING_COUPLE: "Alfina & Mugni"
          VITE_WEDDING_DATE: "December 15, 2024"
          VITE_WEDDING_LOCATION: "Jakarta, Indonesia"
          VITE_WEDDING_HASHTAG: "#AlfinaMugniWedding"
        run: |
          echo "Building for ${{ needs.pre-deploy.outputs.environment }} environment"
          bun run build

      - name: 📊 Build analysis
        run: |
          echo "## Build Analysis 📊" >> $GITHUB_STEP_SUMMARY
          echo "### Build artifacts for ${{ needs.pre-deploy.outputs.environment }}:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find dist/ -type f -name "*.js" -o -name "*.css" -o -name "*.html" | head -20 | xargs ls -lh >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Total build size
          TOTAL_SIZE=$(du -sh dist/ | cut -f1)
          echo "**Total build size:** $TOTAL_SIZE" >> $GITHUB_STEP_SUMMARY

      - name: 🔍 Validate build output
        run: |
          # Check if essential files exist
          if [ ! -f "dist/index.html" ]; then
            echo "❌ index.html not found in build output"
            exit 1
          fi

          # Check if wedding content is present
          if ! grep -q "Alfina.*Mugni\|November.*29.*2025" dist/index.html; then
            echo "❌ Wedding information not found in build output"
            exit 1
          fi

          echo "✅ Build validation passed"

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wedding-website-${{ needs.pre-deploy.outputs.environment }}
          path: dist/
          retention-days: 30

  # Job 3: Deploy to Netlify
  deploy-netlify:
    name: 🌐 Deploy to Netlify (${{ needs.pre-deploy.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [pre-deploy, build]
    if: needs.pre-deploy.outputs.should-deploy == 'true'

    environment:
      name: ${{ needs.pre-deploy.outputs.environment }}
      url: ${{ steps.deploy.outputs.deploy-url }}

    steps:
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wedding-website-${{ needs.pre-deploy.outputs.environment }}
          path: dist/

      - name: 🚀 Deploy to Netlify
        id: deploy
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=dist --prod=${{ needs.pre-deploy.outputs.environment == 'production' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ needs.pre-deploy.outputs.environment == 'production' && secrets.NETLIFY_SITE_ID_PROD || secrets.NETLIFY_SITE_ID_STAGING }}

      - name: 📝 Deployment summary
        run: |
          echo "## 🎉 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Wedding Website Deployed:" >> $GITHUB_STEP_SUMMARY
          echo "- **Couple:** Alfina & Mugni" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ needs.pre-deploy.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy URL:** ${{ steps.deploy.outputs.deploy-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎊 The wedding website is now live and ready for guests! 🎊" >> $GITHUB_STEP_SUMMARY

  # Job 4: Deploy to Vercel (Alternative)
  deploy-vercel:
    name: ▲ Deploy to Vercel (${{ needs.pre-deploy.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [pre-deploy, build]
    if: needs.pre-deploy.outputs.should-deploy == 'true' && false # Disabled by default

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wedding-website-${{ needs.pre-deploy.outputs.environment }}
          path: dist/

      - name: ▲ Deploy to Vercel
        uses: vercel/action@v1
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod=${{ needs.pre-deploy.outputs.environment == 'production' }}

  # Job 5: Deploy to GitHub Pages
  deploy-github-pages:
    name: 📖 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [pre-deploy, build]
    if: needs.pre-deploy.outputs.should-deploy == 'true' && needs.pre-deploy.outputs.environment == 'production'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wedding-website-${{ needs.pre-deploy.outputs.environment }}
          path: dist/

      - name: 🔧 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Job 6: Post-deployment Tests
  post-deploy-tests:
    name: 🧪 Post-deployment Tests
    runs-on: ubuntu-latest
    needs: [pre-deploy, deploy-netlify]
    if: needs.pre-deploy.outputs.should-deploy == 'true'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install test dependencies
        run: npm install -g lighthouse @lhci/cli

      - name: 🌐 Health check
        run: |
          # Wait for deployment to be ready
          sleep 30

          DEPLOY_URL="${{ needs.deploy-netlify.outputs.deploy-url }}"
          echo "Testing deployment at: $DEPLOY_URL"

          # Basic health check
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Website is accessible (HTTP $HTTP_STATUS)"
          else
            echo "❌ Website returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: ⚡ Lighthouse audit
        run: |
          DEPLOY_URL="${{ needs.deploy-netlify.outputs.deploy-url }}"

          echo "## Lighthouse Audit Results ⚡" >> $GITHUB_STEP_SUMMARY

          # Run Lighthouse audit
          lighthouse "$DEPLOY_URL" \
            --chrome-flags="--headless --no-sandbox" \
            --output=json \
            --output-path=lighthouse-report.json \
            --quiet || echo "Lighthouse audit completed with warnings"

          # Extract scores
          if [ -f "lighthouse-report.json" ]; then
            PERFORMANCE=$(cat lighthouse-report.json | jq -r '.categories.performance.score * 100')
            ACCESSIBILITY=$(cat lighthouse-report.json | jq -r '.categories.accessibility.score * 100')
            BEST_PRACTICES=$(cat lighthouse-report.json | jq -r '.categories["best-practices"].score * 100')
            SEO=$(cat lighthouse-report.json | jq -r '.categories.seo.score * 100')
            
            echo "### Scores:" >> $GITHUB_STEP_SUMMARY
            echo "- **Performance:** ${PERFORMANCE}%" >> $GITHUB_STEP_SUMMARY
            echo "- **Accessibility:** ${ACCESSIBILITY}%" >> $GITHUB_STEP_SUMMARY
            echo "- **Best Practices:** ${BEST_PRACTICES}%" >> $GITHUB_STEP_SUMMARY
            echo "- **SEO:** ${SEO}%" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 💒 Wedding content verification
        run: |
          DEPLOY_URL="${{ needs.deploy-netlify.outputs.deploy-url }}"

          echo "## Wedding Content Verification 💒" >> $GITHUB_STEP_SUMMARY

          # Download the page content
          PAGE_CONTENT=$(curl -s "$DEPLOY_URL")

          # Check for wedding information
          if echo "$PAGE_CONTENT" | grep -q "Alfina.*Mugni"; then
            echo "✅ Couple names found" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Couple names not found" >> $GITHUB_STEP_SUMMARY
          fi

          if echo "$PAGE_CONTENT" | grep -q "December.*15.*2024"; then
            echo "✅ Wedding date found" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Wedding date not found" >> $GITHUB_STEP_SUMMARY
          fi

          if echo "$PAGE_CONTENT" | grep -q "Jakarta"; then
            echo "✅ Wedding location found" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Wedding location not found" >> $GITHUB_STEP_SUMMARY
          fi

  # Job 7: Notification
  notify:
    name: 📢 Deployment Notification
    runs-on: ubuntu-latest
    needs: [pre-deploy, deploy-netlify, post-deploy-tests]
    if: always() && needs.pre-deploy.outputs.should-deploy == 'true'

    steps:
      - name: 📧 Send deployment notification
        if: success()
        run: |
          echo "🎉 Wedding website deployment successful!"
          echo "Environment: ${{ needs.pre-deploy.outputs.environment }}"
          echo "URL: ${{ needs.deploy-netlify.outputs.deploy-url }}"
          echo "The website for Alfina & Mugni's wedding is now live! 💒"

      - name: 🚨 Send failure notification
        if: failure()
        run: |
          echo "❌ Wedding website deployment failed!"
          echo "Environment: ${{ needs.pre-deploy.outputs.environment }}"
          echo "Please check the deployment logs and fix any issues."

  # Job 8: Update deployment status
  deployment-summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [pre-deploy, build, deploy-netlify, post-deploy-tests]
    if: always() && needs.pre-deploy.outputs.should-deploy == 'true'

    steps:
      - name: 📊 Generate deployment summary
        run: |
          echo "# 🎉 Wedding Website Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 💒 Wedding Information:" >> $GITHUB_STEP_SUMMARY
          echo "- **Couple:** Alfina & Mugni" >> $GITHUB_STEP_SUMMARY
          echo "- **Wedding Date:** December 15, 2024" >> $GITHUB_STEP_SUMMARY
          echo "- **Location:** Jakarta, Indonesia" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚀 Deployment Details:" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ needs.pre-deploy.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Git commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.deploy-netlify.result }}" = "success" ]; then
            echo "✅ **Deployment Status:** Successful" >> $GITHUB_STEP_SUMMARY
            echo "🌐 **Website URL:** Available" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment Status:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.post-deploy-tests.result }}" = "success" ]; then
            echo "✅ **Health Check:** Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Health Check:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎊 Ready to share with wedding guests! 🎊" >> $GITHUB_STEP_SUMMARY
