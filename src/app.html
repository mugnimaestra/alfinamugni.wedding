<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		
		<!-- Disable browser scroll restoration to prevent flicker -->
		<script>
			if ('scrollRestoration' in history) {
				history.scrollRestoration = 'manual';
			}
		</script>
		
		<!-- Prevent content flash before JS hydration -->
		<style>
			body.cover-active {
				overflow: hidden !important;
			}
		</style>
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="cover-active">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
