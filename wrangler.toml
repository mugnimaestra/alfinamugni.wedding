name = "alfinamugni-wedding"
compatibility_date = "2024-09-21"
compatibility_flags = ["nodejs_compat"]

# Qwik City Pages deployment configuration
pages_build_output_dir = "dist"

# Database bindings
# In local dev (wrangler dev), these use Miniflare's local D1 simulation
# Data is persisted in .wrangler/state/v3/d1/
[[d1_databases]]
binding = "DB"
database_name = "wedding-database"
database_id = "b09507db-7dbb-4fb9-bad6-ab4b3bb3d064"

[[d1_databases]]
binding = "DB_PREVIEW"
database_name = "wedding-database-preview"
database_id = "a2cc2db7-740c-4532-ac34-cb7956aac5d4"

# R2 Storage bindings
# In local dev, these use Miniflare's local R2 simulation
# Data is persisted in .wrangler/state/v3/r2/
[[r2_buckets]]
binding = "WEDDING_PHOTOS"
bucket_name = "wedding-photos-bucket"

[[r2_buckets]]
binding = "WEDDING_PHOTOS_PREVIEW"
bucket_name = "wedding-photos-bucket-preview"

# KV Namespaces
# In local dev, these use Miniflare's local KV simulation
# Data is persisted in .wrangler/state/v3/kv/
[[kv_namespaces]]
binding = "SESSIONS"
id = "7a1d563e050844cc82717f57e1de5e5a"
preview_id = "b228f0fb185347ffa13d54d0aac24ab8"

[[kv_namespaces]]
binding = "ADMIN_KV"
id = "admin-sessions-kv"
preview_id = "admin-sessions-kv-preview"

# Environment variables
[vars]
ENVIRONMENT = "development"

# Environment-specific configuration for Pages
[env.production]
[env.production.vars]
ENVIRONMENT = "production"
ADMIN_EMAIL = "admin@alfinamugni.wedding"
# ADMIN_PASSWORD_HASH will be set via secret

[env.preview]
[env.preview.vars]
ENVIRONMENT = "preview"
ADMIN_EMAIL = "admin@alfinamugni.wedding"
# ADMIN_PASSWORD_HASH will be set via secret

