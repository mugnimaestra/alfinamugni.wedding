name = "alfinamugni-wedding-sveltekit"
compatibility_date = "2024-12-12"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages configuration
pages_build_output_dir = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "wedding-database-preview"
database_id = "a2cc2db7-740c-4532-ac34-cb7956aac5d4"  # Set via environment variable

[[env.production.d1_databases]]
binding = "DB"
database_name = "wedding-database"
database_id = "b09507db-7dbb-4fb9-bad6-ab4b3bb3d064"  # Set via environment variable

# R2 binding for photo storage (used for local dev and preview)
[[r2_buckets]]
binding = "WEDDING_PHOTOS"
bucket_name = "wedding-photos-preview"

# Environment variables
[env.development]
vars = { ENVIRONMENT = "development" }

[env.production]
vars = { ENVIRONMENT = "production" }
